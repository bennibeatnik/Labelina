[package]
name = "labelina"
version = "0.1.0"
description = "Labelina: label studio for parts storage with direct Brother P-touch printing"
authors = ["bennibeatnik"]
license = ""
repository = "https://github.com/bennibeatnik/Labelina"
edition = "2021"
rust-version = "1.80"

[lib]
name = "labelina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7", features = [] }
serialport = "4"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Security",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
