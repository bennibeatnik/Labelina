<!doctype html><meta charset="utf-8"><title>selftest</title>
<script src="../vendor/qrcode.min.js"></script>
<script src="../vendor/JsBarcode.all.min.js"></script>
<script src="../vendor/jspdf.umd.min.js"></script>
<script src="../vendor/jszip.min.js"></script>
<pre id="out"></pre>
<script type="module">
const out = [];
try {
  const R = await import('../js/render.js'); const M = await import('../js/media.js'); const L = await import('../js/library.js');
  const X = await import('../js/exporters.js'); const P = await import('../js/ptouch.js');
  const items = []; for (const c of L.CATEGORIES) items.push(...c.build(L.defaultsFor(c)).slice(0, 2));
  items.push({ lines: ['QR test', 'x', ''], icon: 'gear', codeType: 'qr', code: 'https://example.com/bin/42' });
  items.push({ lines: ['C128', '', ''], icon: '', codeType: 'code128', code: 'BIN-0042' });
  items.push({ lines: ['EAN', '', ''], codeType: 'ean13', code: '400638133393' });
  items.push({ lines: ['bad', '', ''], codeType: 'ean13', code: 'abc' });
  const style = { font: 'Arial', w1: 700, w2: 400, ratio: 0.66, padMm: 1.5, gapMm: 1, edgeMm: 0.2, iconScale: 1, lengthMode: 'auto', lengthMm: 40, unitPitch: 42, unitInset: 6, codePos: 'right', align: 'left', showIcon: true, showIcon2: true, sizeMode: 'auto', border: 'round' };
  let n = 0, errs = new Set();
  for (const media of M.MEDIA) for (const hd of media.hdCapable ? ['', '1'] : ['']) for (const mode of ['auto', 'units', 'fixed']) for (const pos of ['right', 'below', 'left']) for (const lay of ['row', 'split', 'header']) {
    const st = { ...style, lengthMode: mode, codePos: pos, hd, layout: lay };
    const env = { media: R.resolveMedia(media, st), style: st, feedMm: 2 };
    for (const it of items) {
      const lbl = { lines: [...it.lines, '', ''].slice(0, 3), icon: it.icon || '', icon2: it.icon2 || '', codeType: it.codeType || 'none', code: it.code || '', len: null };
      const g = R.layout(lbl, env); const g2 = R.layout(lbl, env, g.autoF); const sc = R.scene(g2, g.autoF, st);
      if (!(sc.W > 0 && sc.H > 0)) throw new Error('bad size ' + media.id);
      if (!Number.isInteger(sc.W) || !Number.isInteger(sc.H)) throw new Error(`label size ${sc.W}×${sc.H} is not whole dots on ${media.id}`);
      const cb = g2.codeBox, tb = g2.textBox;
      if (cb && !cb.below && pos === 'right' && g2.lines.length && cb.x < tb.x + tb.w - 1) throw new Error(`code overlaps text on ${media.id} ${mode} "${lbl.lines[0]}"`);
      if (cb && cb.x + (cb.side || cb.w) > sc.W + 1) throw new Error(`code runs past the label end on ${media.id} ${mode}`);
      for (const it2 of sc.items) if (it2.k === 'text' && !(it2.size > 0)) throw new Error('bad text size ' + media.id + ' ' + lbl.lines[0]);
      sc.errors.forEach(e => errs.add(e.replace(/“.*”/, '“…”')));
      n++;
    }
  }
  out.push('layouts ok: ' + n, 'distinct warnings: ' + [...errs].join(' | '));
  const media = M.MEDIA_MAP['tze-12']; const env = { media, style, feedMm: 2 };
  const scs = items.slice(0, 6).map(it => { const lbl = { lines: [...it.lines, '', ''].slice(0, 3), icon: it.icon || '', icon2: it.icon2 || '', codeType: it.codeType || 'none', code: it.code || '' }; const g = R.layout(lbl, env); return R.scene(R.layout(lbl, env, g.autoF), g.autoF, style); });
  const bms = scs.map(sc => R.toBitmap(R.renderCanvas(sc, 3), 3));
  out.push('bitmap ink dots: ' + bms.map(b => b.bits.reduce((a, c) => a + c, 0)).join(','));
  const job = P.buildRasterJob(bms, { media, marginMm: 2, autoCut: true }); out.push('raster job bytes: ' + job.length);
  const strip = P.joinStrip(bms); out.push('strip: ' + strip.W + 'x' + strip.H);
  out.push('zpl chars: ' + X.bitmapToZPL(bms[0]).length);

  // --- HD (180 x 360 dpi): bitmap height = head pins, QR modules whole dots, job flags and margin
  const hdStyle = { ...style, hd: '1' };
  const hdMedia = R.resolveMedia(media, hdStyle);
  if (!(hdMedia.hd && hdMedia.dpi === 360 && hdMedia.ySub === 2)) throw new Error('HD media not resolved');
  const qrLbl = { lines: ['QR', '', ''], icon: '', icon2: '', codeType: 'qr', code: 'SLICC-42', len: null };
  const hdEnv = { media: hdMedia, style: hdStyle, feedMm: 2 };
  const hg = R.layout(qrLbl, hdEnv); const hsc = R.scene(R.layout(qrLbl, hdEnv, hg.autoF), hg.autoF, hdStyle);
  if (hg.codeBox.y % 2) throw new Error('HD QR does not start on a printer dot');
  const snapEnv = { media: hdMedia, style: { ...hdStyle, qrSnap: true }, feedMm: 2 };
  const sg = R.layout(qrLbl, snapEnv);
  if (sg.codeBox.mod % 2) throw new Error('HD QR modules (snapped) not on whole printer dots');
  // Every QR module row must start on a printer dot in HD, also when sizes are fractional.
  for (const it of R.scene(hg, hg.autoF, hdStyle).items) if (it.k === 'rects') for (const [, y, , h] of it.rects) if (y % 2 || h % 2) throw new Error('HD QR row not on whole printer dots');
  const hbm = R.toBitmap(R.renderCanvas(hsc, 2), 2, 0.5, hsc.ySub);
  if (hbm.H !== media.pins) throw new Error('HD bitmap height ' + hbm.H + ' != ' + media.pins + ' pins');
  if (R.squareBitmap(hbm).H !== media.pins * 2) throw new Error('squareBitmap height wrong');
  const hjob = P.buildRasterJob([hbm], { media: hdMedia, marginMm: 2, autoCut: true });
  const find = (job, seq) => { for (let i = 0; i < job.length; i++) if (seq.every((v, j) => job[i + j] === v)) return i; return -1; };
  if (find(hjob, [0x1b, 0x69, 0x41]) >= 0 || find(job, [0x1b, 0x69, 0x41]) >= 0) throw new Error('job contains ESC i A, which the P710BT family does not support');
  if (find(hjob, [0x1b, 0x69, 0x4b, 0x48]) < 0) throw new Error('HD job missing ESC i K 0x48 (high res + no chain)');
  if (find(hjob, [0x1b, 0x69, 0x64, 28, 0]) < 0) throw new Error('HD job margin is not 28 dots (2 mm at 360 dpi)');
  // Same command set as Brother's own driver (captured from it): see ptouch.js.
  if (find(hjob, [0x1b, 0x69, 0x7a, 0x86, 0x09, 12]) < 0) throw new Error('HD job print info is not flags 0x86 / type 0x09 / 12 mm like Brother\'s driver');
  for (const seq of [[0x1b, 0x69, 0x21, 0x01], [0x1b, 0x69, 0x70, 0x00], [0x1b, 0x69, 0x4c, 0x00, 0x01, 0x01], [0x1b, 0x69, 0x43, 0x01, 0xff, 0xff, 0xff], [0x4d, 0x00]])
    if (find(hjob, seq) < 0) throw new Error('job is missing ' + seq.map(x => x.toString(16)).join(' '));
  // Orientation like Brother's driver: the label's top row prints on the first print-area pin.
  const ob = { bits: new Uint8Array(media.pins * 4), W: 4, H: media.pins }; ob.bits.fill(1, 0, 4); // top row only
  const ojob = P.buildRasterJob([ob], { media, marginMm: 2, autoCut: true });
  const g0 = find(ojob, [0x47, 16, 0]);
  const firstLine = ojob.slice(g0 + 3, g0 + 19);
  const pinOn = p => (firstLine[p >> 3] >> (7 - (p & 7))) & 1;
  if (!pinOn(media.pinOffset) || pinOn(media.pinOffset + media.pins - 1)) throw new Error('top row of the label is not on the first print-area pin');
  const sjob = P.buildRasterJob([bms[0]], { media, marginMm: 1, autoCut: true });
  if (find(sjob, [0x1b, 0x69, 0x64, 14, 0]) < 0) throw new Error('margin below 2 mm was not raised to 14 dots');
  const tube = M.MEDIA_MAP['hse-11.7'];
  const tjob = P.buildRasterJob([{ bits: new Uint8Array(tube.pins * 40), W: 40, H: tube.pins }], { media: tube, marginMm: 2 });
  if (find(tjob, [0x1b, 0x69, 0x7a, 0x80]) < 0) throw new Error('tube job should skip the width check');
  out.push('hd: bitmap ' + hbm.W + 'x' + hbm.H + ', qr module ' + hg.codeBox.mod + ', job bytes ' + hjob.length);

  // --- SLICC presets: printed length (raster + 2 margins) must match the preset in both resolutions
  for (const pre of M.LENGTH_PRESETS.filter(p => p.tight)) for (const hd of ['', '1']) {
    const st = { ...style, hd, lengthMode: 'fixed', lengthMm: pre.mm, padMm: 0, edgeMm: 0 };
    const md = R.resolveMedia(media, st); const lineDpi = md.hd ? 360 : 180;
    const g = R.layout({ lines: ['M3', '', ''], icon: 'gear', codeType: 'none', code: '', len: null }, { media: md, style: st, feedMm: 2 });
    const marginDots = Math.round(2 * lineDpi / 25.4);
    const total = (g.W + 2 * marginDots) / lineDpi * 25.4;
    if (Math.abs(total - pre.mm) > 0.15) throw new Error(`${pre.name} ${hd ? 'HD' : 'SD'} prints ${total.toFixed(2)} mm`);
    out.push(`${pre.name} ${hd ? 'HD' : 'SD'}: ${total.toFixed(2)} mm`);
  }
  const png = await X.canvasToPNG(X.bitmapCanvas(bms[0]), 180); const b = new Uint8Array(await png.arrayBuffer());
  // --- Text fits to the ink, per-line sizes, line spacing, header layout, smooth QR
  {
    const base = { font: 'Arial', padMm: 0, gapMm: 0.5, edgeMm: 0, iconGapMm: 0.3, lineGapMm: 0.3, iconScale: 1, iconScale2: 0.65, lineCount: 3, lengthMode: 'fixed', lengthMm: 63, codePos: 'right', align: 'left', showIcon: true, showIcon2: true, sizeMode: 'auto', border: 'none', layout: 'row', lineRel: [1, 0.6, 0.6, 0.6, 0.6], linePt: [14, 9, 9, 9, 9], lineW: [700, 400, 400, 400, 400] };
    const m12 = M.MEDIA_MAP['tze-12'];
    const lblT = { lines: ['M3×8', 'Socket head', 'ISO 4762'], icon: 'shcs', icon2: 'd-hex', codeType: 'none', code: '', len: null };
    const mk = (st, l = lblT, med = m12) => { const env = { media: R.resolveMedia(med, st), style: st, feedMm: 2 }; const g = R.layout(l, env); const f = R.chooseF(g, st); const g2 = R.layout(l, env, f); return { g: g2, sc: R.scene(g2, f, st) }; };
    const inkRows = (sc, x0, x1) => { const bm = R.toBitmap(R.renderCanvas(sc, 3), 3, 0.5, sc.ySub); let top = -1, bot = -1; for (let y = 0; y < bm.H; y++) for (let x = Math.max(0, Math.floor(x0)); x < Math.min(bm.W, x1); x++) if (bm.bits[y * bm.W + x]) { if (top < 0) top = y; bot = y; break; } return { top, bot, H: bm.H }; };
    // 1. Height-bound text reaches the top and bottom of the print area (within 1 dot).
    { const { g, sc } = mk(base); const r = inkRows(sc, g.textBox.x, g.textBox.x + g.textBox.w);
      if (r.top > 1 || r.bot < r.H - 2) throw new Error(`text ink spans rows ${r.top}..${r.bot} of ${r.H}: not reaching the edges`);
      out.push(`tight text: ink rows ${r.top}..${r.bot} of ${r.H}`); }
    // 2. Fixed sizes: changing line 2's size changes only line 2.
    { const st = { ...base, sizeMode: 'fixed', linePt: [9, 5, 5, 5, 5], lengthMm: 100 };
      const a = mk(st).sc.items.filter(i => i.k === 'text').map(i => i.size.toFixed(2));
      const b = mk({ ...st, linePt: [9, 6, 5, 5, 5] }).sc.items.filter(i => i.k === 'text').map(i => i.size.toFixed(2));
      if (a[0] !== b[0] || a[2] !== b[2] || a[1] === b[1]) throw new Error(`fixed per-line sizes not independent: ${a} -> ${b}`);
      out.push(`fixed per-line sizes: ${a.join('/')} -> ${b.join('/')}`); }
    // 3. Auto: lowering line 3's percentage shrinks line 3 relative to line 2.
    { const a = mk(base).sc.items.filter(i => i.k === 'text').map(i => i.size);
      const b = mk({ ...base, lineRel: [1, 0.6, 0.3, 0.6, 0.6] }).sc.items.filter(i => i.k === 'text').map(i => i.size);
      if (!(b[2] / b[1] < a[2] / a[1] - 0.2)) throw new Error('auto per-line % has no effect on line 3');
      out.push(`auto line 3 at 60% vs 30%: ${(a[2] / a[1]).toFixed(2)} -> ${(b[2] / b[1]).toFixed(2)} of line 2`); }
    // 4. Line spacing 0 packs lines tighter (bigger text) than 1 mm.
    { const s0 = mk({ ...base, lineGapMm: 0 }).sc.items.find(i => i.k === 'text').size, s1 = mk({ ...base, lineGapMm: 1 }).sc.items.find(i => i.k === 'text').size;
      if (!(s0 > s1)) throw new Error('line spacing has no effect');
      out.push(`line spacing 0 vs 1 mm: line 1 ${s0.toFixed(1)} vs ${s1.toFixed(1)} dots`); }
    // 5. Header layout: icon beside line 1 only; lines 2+ start at the text box's left edge.
    { const { g, sc } = mk({ ...base, layout: 'header' });
      const texts = sc.items.filter(i => i.k === 'text'), icons = sc.items.filter(i => i.k === 'icon');
      if (icons.length !== 2) throw new Error('header layout lost an icon');
      if (!(texts[0].x > g.textBox.x + 1)) throw new Error('header layout: line 1 not after the icons');
      if (Math.abs(texts[1].x - g.textBox.x) > 0.5) throw new Error('header layout: line 2 not under the icon');
      // The icons' printed rows must lie within line 1's ink rows.
      const l1Top = texts[0].y - g.L[0].a * texts[0].size, l1Bottom = texts[0].y + g.L[0].d * texts[0].size;
      const I = await import('../js/icons.js');
      for (const ic of icons) {
        const b = I.iconInkBounds(ic.id), top = ic.y + b.y0 * ic.s, bot = ic.y + b.y1 * ic.s;
        if (top < l1Top - 1 || bot > l1Bottom + 1) throw new Error(`header layout: icon ${ic.id} ink ${top.toFixed(0)}..${bot.toFixed(0)} outside line 1 (${l1Top.toFixed(0)}..${l1Bottom.toFixed(0)})`);
        if (ic.x + b.x1 * ic.s > texts[0].x + 0.5) throw new Error('header layout: icon overlaps line 1');
      }
      const r = inkRows(sc, 0, sc.W);
      if (r.top > 1 || r.bot < r.H - 2) throw new Error(`header text block spans ${r.top}..${r.bot} of ${r.H}`);
      out.push(`header layout: line 1 x=${texts[0].x.toFixed(0)}, line 2 x=${texts[1].x.toFixed(0)}, ink rows ${r.top}..${r.bot}`); }
    // 5b. Split layout: first icon full height beside the text, second icon on line 1,
    //     lines 2+ start right after the first icon (under the second icon and line 1).
    { const I = await import('../js/icons.js');
      const { g, sc } = mk({ ...base, layout: 'split' });
      const texts = sc.items.filter(i => i.k === 'text'), icons = sc.items.filter(i => i.k === 'icon');
      const ink = ic => { const b = I.iconInkBounds(ic.id); return { top: ic.y + b.y0 * ic.s, bot: ic.y + b.y1 * ic.s, right: ic.x + b.x1 * ic.s }; };
      const first = icons.find(i => i.id === 'shcs'), second = icons.find(i => i.id === 'd-hex');
      if (!first || !second) throw new Error('split layout lost an icon');
      const a = ink(first), b2 = ink(second);
      if (a.top > 1 || a.bot < sc.H - 1) throw new Error(`split layout: first icon not full height (${a.top.toFixed(0)}..${a.bot.toFixed(0)} of ${sc.H})`);
      const l1Top = texts[0].y - g.L[0].a * texts[0].size, l1Bottom = texts[0].y + g.L[0].d * texts[0].size;
      if (b2.top < l1Top - 1 || b2.bot > l1Bottom + 1) throw new Error('split layout: second icon not on line 1');
      if (Math.abs(texts[1].x - g.textBox.x) > 0.5 || g.textBox.x < a.right) throw new Error('split layout: line 2 not right after the first icon');
      if (!(texts[0].x > b2.right - 0.5)) throw new Error('split layout: line 1 overlaps the second icon');
      out.push(`split layout: first icon rows ${a.top.toFixed(0)}..${a.bot.toFixed(0)}, second icon on line 1, line 2 x=${texts[1].x.toFixed(0)}`); }
    // 5c. Lines that fill the length are flagged as limited (so the app can say why they don't grow),
    //     and the split layout gives lines 2–3 more room than the row layout on a 33 mm label.
    { const lbl33 = { ...lblT, lines: ['M3×8', 'Socket head · A2 SS', 'ISO 4762 · Key 2.5'] };
      const row = mk({ ...base, lengthMm: 33, lineRel: [1, 1, 1, 1, 1] }, lbl33).sc.items.filter(i => i.k === 'text');
      const split = mk({ ...base, lengthMm: 33, lineRel: [1, 1, 1, 1, 1], layout: 'split' }, lbl33).sc.items.filter(i => i.k === 'text');
      if (!row[1].limited || !row[2].limited) throw new Error('33 mm: long lines 2–3 should be flagged as limited by length');
      if (!(split[1].size > row[1].size * 1.1)) throw new Error('split layout does not give line 2 more room');
      out.push(`33 mm line 2: row ${(row[1].size * 72 / 180).toFixed(1)} pt (limited) -> split ${(split[1].size * 72 / 180).toFixed(1)} pt`); }
    // 6. QR size follows the slider smoothly and never disappears on 12 mm tape.
    { const sides = [];
      for (let s = 0.3; s <= 1.0001; s += 0.05) {
        const env = { media: m12, style: { ...base, qrQuiet: 1 }, feedMm: 2, codeScale: s };
        const g = R.layout({ ...lblT, codeType: 'qr', code: 'M3x8-SHCS' }, env);
        if (!g.codeBox) throw new Error('QR disappeared at size ' + s.toFixed(2));
        sides.push(g.codeBox.side);
      }
      for (let i = 1; i < sides.length; i++) if (sides[i] < sides[i - 1]) throw new Error('QR size went down as the slider went up: ' + sides.join(','));
      if (new Set(sides).size < sides.length * 0.7) throw new Error('QR size moves in big steps: ' + sides.join(','));
      out.push('QR side over slider 30..100%: ' + sides.join(',')); }
  }
  out.push('png pHYs at 37: ' + String.fromCharCode(...b.slice(37, 41)) + ' size ' + b.length);
  const svg = R.renderSVG(scs[0], () => null, ''); out.push('svg length ' + svg.length + ' starts ' + svg.slice(0, 38).replace(/\n/g, ' '));
  const its = bms.map(bm => ({ canvas: X.bitmapCanvas(bm), wMm: bm.W / 180 * 25.4, hMm: bm.H / 180 * 25.4, qty: 2 }));
  out.push('pdf each bytes: ' + X.pdfPerLabel(its).size);
  out.push('pdf sheet (template) bytes: ' + X.pdfSheet(its, M.MEDIA_MAP['sh-5160'].sheet, 'letter', { skip: 3 }).size);
  out.push('pdf sheet (packed) bytes: ' + X.pdfSheet(its, null, 'a4').size);
  out.push('zip bytes: ' + (await X.zipFiles([{ name: 'a.txt', data: 'x' }, { name: 'a.txt', data: 'y' }])).size);
  out.push('csv parse: ' + JSON.stringify(X.parseTable('line1,code\n"M3, x",abc\n')));
  out.push('DONE');
} catch (e) { out.push('FAIL ' + (e.stack || e)); }
document.getElementById('out').textContent = out.join('\n');
</script>
